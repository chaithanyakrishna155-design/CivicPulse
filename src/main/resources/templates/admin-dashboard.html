<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | CivicPulse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

:root {
    --bg: #f4f7fc;
    --text: #212529;
    --card-bg: #ffffff;
    --shadow: 0 4px 10px rgba(0,0,0,0.15);
    --heading-color: #1565c0;
    --border-color: #dee2e6;
    --message-color: #212529;
    --btn-primary: #1565c0;
    --btn-primary-hover: #0d47a1;
    --btn-warning: #ffc107;
    --btn-warning-hover: #e0a800;
    --btn-success: #198754;
    --btn-success-hover: #157347;
    --navbar-bg: #1565c0;
    --stats-total: #1565c0;
    --stats-pending: #ff9800;
    --stats-progress: #03a9f4;
    --stats-resolved: #4caf50;
}

[data-theme="dark"] {
    --bg: #121212;
    --text: #ffffff;
    --card-bg: #1f1f1f;
    --shadow: 0 4px 15px rgba(0,0,0,0.6);
    --heading-color: #4fc3f7;
    --border-color: #404040;
    --message-color: #ffffff;
    --btn-primary: #0d47a1;
    --btn-primary-hover: #1565c0;
    --btn-warning: #f57c00;
    --btn-warning-hover: #e65100;
    --btn-success: #1b5e20;
    --btn-success-hover: #2e7d32;
    --navbar-bg: #0d1117;
    --stats-total: #0d47a1;
    --stats-pending: #e65100;
    --stats-progress: #0277bd;
    --stats-resolved: #1b5e20;
}

* {
    transition: all 0.3s ease;
}

body {
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    color: var(--text);
    padding: 0;
}

/* ===== NAVBAR ===== */
.navbar {
    background: var(--navbar-bg) !important;
    padding: 15px 0;
    box-shadow: var(--shadow);
}

.navbar-brand {
    color: white !important;
    font-size: 24px;
    font-weight: bold;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.notification-wrapper {
    position: relative;
    display: inline-block;
}

.notification-btn {
    width: 45px !important;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
    transition: all 0.3s ease;
    text-decoration: none;
}

.notification-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
}

.notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff4444;
    color: white;
    border-radius: 50%;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: bold;
    min-width: 22px;
    text-align: center;
    border: 2px solid var(--navbar-bg);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.notification-badge.zero {
    display: none;
}

.theme-btn {
    width: 45px !important;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    border: none;
}

.logout-btn {
    width: auto !important;
}

/* ===== CONTAINER ===== */
.container-main {
    padding: 30px 0 50px 0;
}

h2 {
    color: var(--heading-color);
    text-align: center;
    margin-bottom: 30px;
}

/* ===== STATS CARDS ===== */
.stats-card {
    border: none;
    border-radius: 15px;
    color: white;
    box-shadow: var(--shadow);
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
}

.stats-card:hover {
    transform: translateY(-5px);
}

.stats-card .stats-icon {
    font-size: 32px;
    margin-bottom: 10px;
    opacity: 0.8;
}

.stats-card h5 {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 5px;
}

.stats-card h1 {
    font-size: 32px;
    font-weight: bold;
    margin: 0;
}

.stats-total { background: var(--stats-total); }
.stats-pending { background: var(--stats-pending); }
.stats-progress { background: var(--stats-progress); }
.stats-resolved { background: var(--stats-resolved); }

/* ===== ACTION CARD ===== */
.action-card {
    box-shadow: var(--shadow);
    padding: 30px;
    border-radius: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text);
}

.action-card h4 {
    color: var(--message-color);
    margin-bottom: 20px;
}

.action-card hr {
    border-color: var(--border-color);
    margin-bottom: 25px;
}

/* ===== BUTTONS ===== */
.btn-primary {
    background: var(--btn-primary);
    border-color: var(--btn-primary);
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
}

.btn-primary:hover {
    background: var(--btn-primary-hover);
    border-color: var(--btn-primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
}

.btn-warning {
    background: var(--btn-warning);
    border-color: var(--btn-warning);
    color: #212529;
    padding: 12px 25px;
    border-radius: 8px;
}

[data-theme="dark"] .btn-warning {
    color: white;
}

.btn-warning:hover {
    background: var(--btn-warning-hover);
    border-color: var(--btn-warning-hover);
    transform: translateY(-2px);
}

.btn-success {
    background: var(--btn-success);
    border-color: var(--btn-success);
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
}

.btn-success:hover {
    background: var(--btn-success-hover);
    border-color: var(--btn-success-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
}

.btn {
    margin: 5px;
    transition: all 0.3s ease;
    font-weight: 500;
}

.btn i {
    margin-right: 8px;
}

/* ===== DARK MODE SPECIFIC ===== */
[data-theme="dark"] .theme-btn {
    background: #1f1f1f;
    color: white;
    border: 1px solid #404040;
}

[data-theme="dark"] .btn-warning {
    color: white;
}

[data-theme="dark"] .notification-btn {
    background: rgba(255,255,255,0.1);
}

[data-theme="dark"] .notification-btn:hover {
    background: rgba(255,255,255,0.2);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .container-main {
        padding: 15px;
        margin-top: 20px;
    }
    
    .action-card {
        padding: 20px;
    }
    
    .theme-btn,
    .notification-btn {
        width: 38px !important;
        height: 38px;
        font-size: 16px;
    }
    
    .navbar-brand {
        font-size: 18px;
    }
    
    h2 {
        font-size: 22px;
        margin-top: 10px;
    }
    
    .btn {
        width: 100%;
        margin: 5px 0;
        display: block;
        text-align: center;
    }
    
    .btn.me-2 {
        margin-right: 0 !important;
    }
    
    .stats-card {
        margin-bottom: 10px;
    }
    
    .stats-card h1 {
        font-size: 24px;
    }
}

</style>

</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand">
            🏛️ CivicPulse Admin
        </span>
        <div class="nav-right">
            <!-- Notification Bell -->
            <div class="notification-wrapper">
                <a href="/notifications" class="notification-btn" title="Notifications">
                    <i class="bi bi-bell-fill"></i>
                </a>
                <span class="notification-badge" id="notificationBadge">0</span>
            </div>
            <!-- Theme Toggle -->
            <button id="themeToggle" class="btn btn-light theme-btn">
                <i id="themeIcon" class="bi bi-moon-fill"></i>
            </button>
            <!-- Logout -->
            <a href="/logout" class="btn btn-danger logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<div class="container container-main">

    <h2><i class="bi bi-speedometer2"></i> Admin Dashboard</h2>

    <!-- ===== STATISTICS CARDS ===== -->
    <div class="row g-4 mb-4">
        <div class="col-md-3 col-6">
            <div class="stats-card stats-total">
                <div class="stats-icon">📊</div>
                <h5>Total Complaints</h5>
                <h1 th:text="${totalComplaints}">0</h1>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stats-card stats-pending">
                <div class="stats-icon">⏳</div>
                <h5>Pending</h5>
                <h1 th:text="${pendingComplaints}">0</h1>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stats-card stats-progress">
                <div class="stats-icon">🔄</div>
                <h5>In Progress</h5>
                <h1 th:text="${inProgressComplaints}">0</h1>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stats-card stats-resolved">
                <div class="stats-icon">✅</div>
                <h5>Resolved</h5>
                <h1 th:text="${resolvedComplaints}">0</h1>
            </div>
        </div>
    </div>

    <!-- ===== ACTION CARDS ===== -->
    <div class="action-card">
        <h4><i class="bi bi-person-gear"></i> <span th:text="${message}">Welcome Admin</span></h4>
        <hr>

        <div class="row g-3">
            <div class="col-md-4">
                <a href="/complaints" class="btn btn-primary w-100">
                    <i class="bi bi-list-ul"></i> View Complaints
                </a>
            </div>
            <div class="col-md-4">
                <a href="/admin/add-officer" class="btn btn-warning w-100">
                    <i class="bi bi-person-plus"></i> Add Officer
                </a>
            </div>
            <div class="col-md-4">
                <a href="/admin/assign-complaint" class="btn btn-success w-100">
                    <i class="bi bi-person-check"></i> Assign Complaint
                </a>
            </div>
        </div>
    </div>

    <!-- ===== QUICK STATS ===== -->
    <div class="row g-3 mt-3">
        <div class="col-md-6">
            <div class="action-card" style="padding: 15px 20px;">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-people"></i> Total Officers</span>
                    <span class="badge bg-primary" style="font-size: 16px;" th:text="${totalOfficers}">0</span>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="action-card" style="padding: 15px 20px;">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-clock-history"></i> Today's Complaints</span>
                    <span class="badge bg-info" style="font-size: 16px;" th:text="${todayComplaints}">0</span>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// ==========================
// THEME TOGGLE
// ==========================

const toggle = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    if (theme === "dark") {
        icon.className = "bi bi-sun-fill";
        toggle.classList.remove("btn-light");
        toggle.classList.add("btn-warning");
    } else {
        icon.className = "bi bi-moon-fill";
        toggle.classList.remove("btn-warning");
        toggle.classList.add("btn-light");
    }
}

toggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
});

window.addEventListener("DOMContentLoaded", () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    setTheme(savedTheme);
    updateNotificationBadge();
});

// ==========================
// NOTIFICATION FUNCTIONS
// ==========================

const badge = document.getElementById("notificationBadge");

function updateNotificationBadge() {
    const userId = '[[${#authentication.name}]]';
    if (userId && userId !== '' && userId !== 'null' && userId !== 'undefined') {
        fetch(`/notifications/api/user/${userId}/count`)
            .then(response => response.json())
            .then(data => {
                const count = data.count || 0;
                badge.textContent = count;
                if (count > 0) {
                    badge.classList.remove('zero');
                    badge.style.display = 'block';
                } else {
                    badge.classList.add('zero');
                    badge.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Error fetching notification count:', error);
            });
    }
}

// Auto-refresh notification count every 30 seconds
setInterval(() => {
    const userId = '[[${#authentication.name}]]';
    if (userId && userId !== '' && userId !== 'null' && userId !== 'undefined') {
        fetch(`/notifications/api/user/${userId}/count`)
            .then(response => response.json())
            .then(data => {
                const count = data.count || 0;
                badge.textContent = count;
                if (count > 0) {
                    badge.classList.remove('zero');
                    badge.style.display = 'block';
                } else {
                    badge.classList.add('zero');
                    badge.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Error fetching notification count:', error);
            });
    }
}, 30000);

</script>

</body>

</html>
