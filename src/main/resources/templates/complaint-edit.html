<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Complaint | CivicPulse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

:root {
    --bg: #f4f4f4;
    --text: #212529;
    --container-bg: #ffffff;
    --shadow: 0 0 10px rgba(0,0,0,0.2);
    --input-bg: #ffffff;
    --input-border: #ccc;
    --input-text: #212529;
    --heading-color: #1565c0;
    --label-color: #333;
    --button-bg: #1565c0;
    --button-hover: #0d47a1;
    --button-text: white;
    --readonly-bg: #e9ecef;
    --readonly-text: #6c757d;
    --navbar-bg: #1565c0;
    --alert-success-bg: #d4edda;
    --alert-success-text: #155724;
    --alert-success-border: #c3e6cb;
    --alert-danger-bg: #f8d7da;
    --alert-danger-text: #721c24;
    --alert-danger-border: #f5c6cb;
}

[data-theme="dark"] {
    --bg: #121212;
    --text: #ffffff;
    --container-bg: #1f1f1f;
    --shadow: 0 0 20px rgba(0,0,0,0.6);
    --input-bg: #2a2a2a;
    --input-border: #404040;
    --input-text: #ffffff;
    --heading-color: #4fc3f7;
    --label-color: #e0e0e0;
    --button-bg: #0d47a1;
    --button-hover: #1565c0;
    --button-text: white;
    --readonly-bg: #2a2a2a;
    --readonly-text: #aaaaaa;
    --navbar-bg: #0d1117;
    --alert-success-bg: #1a3a2a;
    --alert-success-text: #8fdfb2;
    --alert-success-border: #2a5a3a;
    --alert-danger-bg: #3a1a1a;
    --alert-danger-text: #ff8f8f;
    --alert-danger-border: #5a2a2a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    transition: all 0.3s ease;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    position: relative;
}

/* ===== NAVBAR ===== */
.navbar {
    background: var(--navbar-bg) !important;
    padding: 15px 0;
    box-shadow: var(--shadow);
}

.navbar-brand {
    color: white !important;
    font-size: 24px;
    font-weight: bold;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.theme-btn {
    width: 45px !important;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    border: none;
}

.logout-btn {
    width: auto !important;
}

/* ===== CONTAINER ===== */
.container-main {
    padding: 30px 0 50px 0;
}

.form-container {
    max-width: 550px;
    margin: 0 auto;
    background: var(--container-bg);
    padding: 35px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    color: var(--text);
}

h2 {
    text-align: center;
    color: var(--heading-color);
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: var(--text);
    opacity: 0.7;
    margin-bottom: 25px;
    font-size: 14px;
}

/* ===== FORM ELEMENTS ===== */
label {
    display: block;
    margin-top: 12px;
    font-weight: 600;
    color: var(--label-color);
    font-size: 14px;
}

label i {
    margin-right: 6px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 5px 0 10px 0;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--input-text);
    font-size: 14px;
}

input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--heading-color);
    border-color: transparent;
    box-shadow: none;
}

input[readonly], textarea[readonly] {
    background: var(--readonly-bg);
    color: var(--readonly-text);
    cursor: not-allowed;
    opacity: 0.8;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

select option {
    background: var(--input-bg);
    color: var(--input-text);
}

/* ===== READONLY FIELD ICON ===== */
.readonly-icon {
    position: relative;
}

.readonly-icon::after {
    content: "🔒";
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.5;
}

/* ===== BUTTONS ===== */
.btn-update {
    width: 100%;
    padding: 14px;
    background: var(--button-bg);
    color: var(--button-text);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    margin-top: 20px;
    transition: all 0.3s ease;
}

.btn-update:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
}

.btn-update i {
    margin-right: 8px;
}

.btn-update:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* ===== STATUS BADGE IN DROPDOWN ===== */
.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.status-pending { background: #ff9800; color: white; }
.status-progress { background: #03a9f4; color: white; }
.status-resolved { background: #4caf50; color: white; }

/* ===== ALERTS ===== */
.alert {
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.alert-success {
    background-color: var(--alert-success-bg);
    color: var(--alert-success-text);
    border-color: var(--alert-success-border);
}

.alert-danger {
    background-color: var(--alert-danger-bg);
    color: var(--alert-danger-text);
    border-color: var(--alert-danger-border);
}

.alert .alert-icon {
    font-size: 20px;
}

/* ===== BACK LINK ===== */
.back-link {
    display: inline-block;
    margin-top: 15px;
    color: var(--heading-color);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
}

.back-link:hover {
    text-decoration: underline;
    transform: translateX(-3px);
}

.back-link i {
    margin-right: 6px;
}

/* ===== LOADING SPINNER ===== */
.spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
    margin: 0 auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== DARK MODE ===== */
[data-theme="dark"] .theme-btn {
    background: #1f1f1f;
    color: white;
    border: 1px solid #404040;
}

[data-theme="dark"] select option {
    background: #1f1f1f;
    color: white;
}

[data-theme="dark"] input::placeholder,
[data-theme="dark"] textarea::placeholder {
    color: #888;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .container-main {
        padding: 15px;
        margin-top: 20px;
    }
    
    .form-container {
        padding: 20px;
        margin: 0 5px;
    }
    
    .theme-btn {
        width: 38px !important;
        height: 38px;
        font-size: 16px;
    }
    
    .navbar-brand {
        font-size: 18px;
    }
    
    h2 {
        font-size: 22px;
    }
    
    .btn-update {
        padding: 12px;
        font-size: 15px;
    }
}

</style>

</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand">
            🏛️ CivicPulse
        </span>
        <div class="nav-right">
            <button id="themeToggle" class="btn btn-light theme-btn">
                <i id="themeIcon" class="bi bi-moon-fill"></i>
            </button>
            <a href="/logout" class="btn btn-danger logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<div class="container container-main">

    <div class="form-container">

        <h2>✏️ Edit Complaint</h2>
        <p class="subtitle">Update the status of the complaint</p>

        <!-- Success Message -->
        <div th:if="${success}" class="alert alert-success">
            <span class="alert-icon">✅</span>
            <span th:text="${success}">Complaint updated successfully!</span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span class="alert-icon">❌</span>
            <span th:text="${error}">Failed to update complaint</span>
        </div>

        <form th:action="@{/complaint/update}" th:object="${complaint}" method="post" id="editForm">

            <input type="hidden" th:field="*{id}">

            <!-- Complaint ID (hidden, but show as readonly) -->
            <div style="display: none;">
                <input type="text" th:field="*{id}" readonly>
            </div>

            <label><i class="bi bi-tag"></i> Complaint ID</label>
            <input type="text" th:value="*{id}" readonly style="background: var(--readonly-bg); color: var(--readonly-text);">

            <label><i class="bi bi-card-heading"></i> Title</label>
            <input type="text" th:field="*{title}" readonly>

            <label><i class="bi bi-file-text"></i> Description</label>
            <textarea th:field="*{description}" rows="3" readonly></textarea>

            <label><i class="bi bi-folder"></i> Category</label>
            <input type="text" th:field="*{category}" readonly>

            <label><i class="bi bi-geo-alt"></i> Location</label>
            <input type="text" th:field="*{location}" readonly>

            <label><i class="bi bi-clock-history"></i> Status</label>
            <select th:field="*{status}" id="statusSelect">
                <option value="Pending">⏳ Pending</option>
                <option value="In Progress">🔄 In Progress</option>
                <option value="Resolved">✅ Resolved</option>
            </select>
            <small class="text-muted" style="display: block; margin-top: 4px; font-size: 12px;">
                <i class="bi bi-info-circle"></i> Changing status will notify the complainant
            </small>

            <!-- Show current status badge -->
            <div style="margin-top: 10px; padding: 10px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border-color);">
                <span style="opacity: 0.7;">Current Status:</span>
                <span id="statusBadge" class="status-badge" 
                      th:classappend="${complaint.status == 'Pending' ? 'status-pending' : ''}
                                    ${complaint.status == 'In Progress' ? 'status-progress' : ''}
                                    ${complaint.status == 'Resolved' ? 'status-resolved' : ''}"
                      th:text="${complaint.status}">Pending</span>
            </div>

            <button type="submit" class="btn-update" id="submitBtn">
                <i class="bi bi-save"></i>
                <span id="btnText">Update Complaint</span>
                <span id="btnSpinner" class="spinner"></span>
            </button>

        </form>

        <div style="margin-top: 15px; text-align: center;">
            <a href="/complaints" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Complaints
            </a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

// ==========================
// THEME TOGGLE
// ==========================

const toggle = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    if (theme === "dark") {
        icon.className = "bi bi-sun-fill";
        toggle.classList.remove("btn-light");
        toggle.classList.add("btn-warning");
    } else {
        icon.className = "bi bi-moon-fill";
        toggle.classList.remove("btn-warning");
        toggle.classList.add("btn-light");
    }
}

toggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
});

window.addEventListener("DOMContentLoaded", () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    setTheme(savedTheme);
});

// ==========================
// STATUS SELECT PREVIEW
// ==========================

const statusSelect = document.getElementById('statusSelect');
const statusBadge = document.getElementById('statusBadge');

statusSelect.addEventListener('change', function() {
    const selectedValue = this.value;
    // Update the badge preview
    statusBadge.textContent = selectedValue;
    statusBadge.className = 'status-badge';
    if (selectedValue === 'Pending') {
        statusBadge.classList.add('status-pending');
    } else if (selectedValue === 'In Progress') {
        statusBadge.classList.add('status-progress');
    } else if (selectedValue === 'Resolved') {
        statusBadge.classList.add('status-resolved');
    }
});

// ==========================
// FORM SUBMISSION WITH LOADING
// ==========================

document.getElementById('editForm').addEventListener('submit', function(e) {
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    
    // Show loading state
    btnText.textContent = 'Updating...';
    btnSpinner.style.display = 'inline-block';
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.7';
});

// ==========================
// SHOW ALERT FUNCTION
// ==========================

function showAlert(message, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type}`;
    alertDiv.innerHTML = `
        <span class="alert-icon">${type === 'success' ? '✅' : '❌'}</span>
        <span>${message}</span>
    `;
    
    const container = document.querySelector('.form-container');
    const form = document.getElementById('editForm');
    container.insertBefore(alertDiv, form);
    
    setTimeout(() => {
        alertDiv.style.transition = 'opacity 0.5s ease';
        alertDiv.style.opacity = '0';
        setTimeout(() => alertDiv.remove(), 500);
    }, 5000);
}

// ==========================
// AUTO-DISMISS ALERTS
// ==========================

document.addEventListener('DOMContentLoaded', function() {
    const alerts = document.querySelectorAll('.alert');
    alerts.forEach(alert => {
        setTimeout(() => {
            alert.style.transition = 'opacity 0.5s ease';
            alert.style.opacity = '0';
            setTimeout(() => {
                alert.remove();
            }, 500);
        }, 5000);
    });
});

// ==========================
// KEYBOARD SHORTCUTS
// ==========================

document.addEventListener('keydown', function(e) {
    // Ctrl+Enter to submit
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        document.getElementById('editForm').submit();
    }
    
    // Escape to go back
    if (e.key === 'Escape') {
        window.location.href = '/complaints';
    }
});

</script>

</body>

</html>
