<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Complaint | CivicPulse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

:root {
    --bg: #f4f7fc;
    --text: #212529;
    --container-bg: #ffffff;
    --shadow: 0 0 20px rgba(0,0,0,0.2);
    --input-bg: #ffffff;
    --input-border: #ccc;
    --input-text: #212529;
    --heading-color: #1565c0;
    --subtitle-color: #777;
    --button-bg: #1565c0;
    --button-text: white;
    --modal-bg: rgba(0,0,0,0.7);
    --modal-box-bg: white;
    --close-bg: red;
    --done-bg: green;
    --retake-bg: orange;
    --navbar-bg: #1565c0;
    --alert-success-bg: #d4edda;
    --alert-success-text: #155724;
    --alert-success-border: #c3e6cb;
    --alert-danger-bg: #f8d7da;
    --alert-danger-text: #721c24;
    --alert-danger-border: #f5c6cb;
}

[data-theme="dark"] {
    --bg: #121212;
    --text: #ffffff;
    --container-bg: #1f1f1f;
    --shadow: 0 0 20px rgba(0,0,0,0.6);
    --input-bg: #2a2a2a;
    --input-border: #404040;
    --input-text: #ffffff;
    --heading-color: #4fc3f7;
    --subtitle-color: #aaa;
    --button-bg: #0d47a1;
    --button-text: white;
    --modal-bg: rgba(0,0,0,0.9);
    --modal-box-bg: #1f1f1f;
    --close-bg: #cc0000;
    --done-bg: #1b5e20;
    --retake-bg: #e65100;
    --navbar-bg: #0d1117;
    --alert-success-bg: #1a3a2a;
    --alert-success-text: #8fdfb2;
    --alert-success-border: #2a5a3a;
    --alert-danger-bg: #3a1a1a;
    --alert-danger-text: #ff8f8f;
    --alert-danger-border: #5a2a2a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    transition: all 0.3s ease;
}

body {
    background: var(--bg);
    min-height: 100vh;
    padding: 0;
    position: relative;
}

/* ===== NAVBAR ===== */
.navbar {
    background: var(--navbar-bg) !important;
    padding: 15px 0;
    box-shadow: var(--shadow);
}

.navbar-brand {
    color: white !important;
    font-size: 24px;
    font-weight: bold;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.theme-btn {
    width: 45px !important;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    border: none;
}

.logout-btn {
    width: auto !important;
}

/* ===== CONTAINER ===== */
.container-main {
    padding: 30px 0 50px 0;
}

.form-container {
    width: 550px;
    max-width: 100%;
    background: var(--container-bg);
    padding: 35px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    color: var(--text);
    margin: 0 auto;
}

h2 {
    text-align: center;
    color: var(--heading-color);
}

.subtitle {
    text-align: center;
    color: var(--subtitle-color);
    margin: 10px 0 20px 0;
    font-size: 14px;
}

/* ===== FORM ELEMENTS ===== */
input,
select,
textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--input-text);
    font-size: 14px;
}

input:focus,
select:focus,
textarea:focus {
    outline: 2px solid var(--heading-color);
    border-color: transparent;
    box-shadow: none;
}

textarea {
    height: 100px;
    resize: vertical;
}

label {
    font-weight: 600;
    font-size: 14px;
    color: var(--label-color);
    display: block;
    margin-top: 5px;
}

label i {
    margin-right: 6px;
}

/* ===== BUTTONS ===== */
.btn-submit {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: var(--button-bg);
    color: var(--button-text);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
}

.btn-submit:hover {
    opacity: 0.85;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
}

.btn-submit i {
    margin-right: 8px;
}

.btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* ===== CAMERA BUTTON ===== */
.camera-icon {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    font-size: 32px;
    display: block;
    margin: 15px auto;
    background: var(--button-bg);
    color: var(--button-text);
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}

.camera-icon:hover {
    transform: scale(1.1);
    opacity: 0.9;
    box-shadow: 0 4px 15px rgba(21, 101, 192, 0.4);
}

.camera-icon i {
    display: block;
}

/* ===== FILE UPLOAD ===== */
.file-upload-wrapper {
    position: relative;
    border: 2px dashed var(--input-border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    margin: 10px 0;
}

.file-upload-wrapper:hover {
    border-color: var(--heading-color);
    background: var(--bg);
}

.file-upload-wrapper input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

.file-upload-wrapper .upload-icon {
    font-size: 40px;
    color: var(--heading-color);
    opacity: 0.5;
}

.file-upload-wrapper .upload-text {
    margin-top: 8px;
    font-size: 14px;
    color: var(--subtitle-color);
}

/* ===== FILE PREVIEW ===== */
.file-preview {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border-color);
    display: none;
}

.file-preview.show {
    display: block;
}

.file-preview img,
.file-preview video {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
}

.file-preview .file-name {
    font-size: 13px;
    font-weight: 500;
    margin-top: 5px;
}

/* ===== ALERTS ===== */
.alert {
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.alert-success {
    background-color: var(--alert-success-bg);
    color: var(--alert-success-text);
    border-color: var(--alert-success-border);
}

.alert-danger {
    background-color: var(--alert-danger-bg);
    color: var(--alert-danger-text);
    border-color: var(--alert-danger-border);
}

.alert .alert-icon {
    font-size: 20px;
}

/* ===== BACK LINK ===== */
.back-link {
    display: inline-block;
    margin-top: 15px;
    color: var(--heading-color);
    text-decoration: none;
    font-weight: 500;
}

.back-link:hover {
    text-decoration: underline;
}

.back-link i {
    margin-right: 6px;
}

/* ===== CAMERA MODAL ===== */
.camera-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--modal-bg);
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
}

.camera-box {
    background: var(--modal-box-bg);
    width: 400px;
    max-width: 100%;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    color: var(--text);
    border: 1px solid var(--input-border);
}

.camera-box h3 {
    color: var(--heading-color);
    margin-bottom: 15px;
}

.camera-box video {
    width: 100%;
    height: 250px;
    background: black;
    border-radius: 8px;
}

.camera-actions {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.camera-actions button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.camera-actions button:first-child {
    background: #1976d2;
    color: white;
}

.camera-actions button:last-child {
    background: #d32f2f;
    color: white;
}

.camera-actions button:hover {
    opacity: 0.85;
    transform: scale(1.02);
}

.done {
    background: var(--done-bg);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}

.retake {
    background: var(--retake-bg);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}

.close {
    background: var(--close-bg);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}

.done:hover,
.retake:hover,
.close:hover {
    opacity: 0.85;
    transform: scale(1.02);
}

.preview img,
.preview video {
    width: 100%;
    margin-top: 10px;
    border-radius: 8px;
}

/* ===== LOADING SPINNER ===== */
.spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
    margin: 0 auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== DARK MODE ===== */
[data-theme="dark"] .camera-box {
    border: 1px solid #404040;
}

[data-theme="dark"] .camera-actions button:first-child {
    background: #0d47a1;
}

[data-theme="dark"] .camera-actions button:last-child {
    background: #b71c1c;
}

[data-theme="dark"] select option {
    background: #1f1f1f;
    color: white;
}

[data-theme="dark"] input::placeholder,
[data-theme="dark"] textarea::placeholder {
    color: #888;
}

[data-theme="dark"] .theme-btn {
    background: #1f1f1f;
    color: white;
    border: 1px solid #404040;
}

[data-theme="dark"] .file-upload-wrapper:hover {
    background: #1a1a1a;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .container-main {
        padding: 15px;
    }
    
    .form-container {
        padding: 20px;
        margin: 0 5px;
    }
    
    .theme-btn {
        width: 38px !important;
        height: 38px;
        font-size: 16px;
    }
    
    .navbar-brand {
        font-size: 18px;
    }
    
    h2 {
        font-size: 22px;
    }
    
    .camera-box {
        width: 100%;
    }
    
    .camera-actions {
        flex-direction: column;
    }
}

</style>

</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand">
            🏛️ CivicPulse
        </span>
        <div class="nav-right">
            <button id="themeToggle" class="btn btn-light theme-btn">
                <i id="themeIcon" class="bi bi-moon-fill"></i>
            </button>
            <a href="/logout" class="btn btn-danger logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<div class="container container-main">

    <div class="form-container">

        <h2>📢 Register Complaint</h2>
        <p class="subtitle">Fill in the details and capture evidence for your complaint</p>

        <!-- Success Message -->
        <div th:if="${success}" class="alert alert-success">
            <span class="alert-icon">✅</span>
            <span th:text="${success}">Complaint submitted successfully!</span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span class="alert-icon">❌</span>
            <span th:text="${error}">Failed to submit complaint</span>
        </div>

        <form action="/complaint/save" method="post" enctype="multipart/form-data" id="complaintForm">

            <!-- Title -->
            <label><i class="bi bi-card-heading"></i> Complaint Title</label>
            <input type="text" name="title" placeholder="Enter complaint title" required>

            <!-- Category -->
            <label><i class="bi bi-folder"></i> Category</label>
            <select name="category" required>
                <option value="">-- Select Category --</option>
                <option>Road</option>
                <option>Water Supply</option>
                <option>Electricity</option>
                <option>Garbage</option>
                <option>Street Light</option>
                <option>Others</option>
            </select>

            <!-- Location -->
            <label><i class="bi bi-geo-alt"></i> Location</label>
            <input type="text" name="location" placeholder="Enter location" required>

            <!-- Description -->
            <label><i class="bi bi-file-text"></i> Description</label>
            <textarea name="description" placeholder="Describe your complaint in detail" required></textarea>

            <!-- Camera Button -->
            <div style="text-align: center;">
                <button type="button" class="camera-icon" onclick="openCamera()">
                    <i class="bi bi-camera"></i>
                </button>
                <p style="text-align:center; color: var(--subtitle-color); font-size: 13px; margin-top: 5px;">
                    <i class="bi bi-camera-fill"></i> Capture Photo or Video
                </p>
            </div>

            <!-- File Upload -->
            <label><i class="bi bi-paperclip"></i> Upload Evidence</label>
            <div class="file-upload-wrapper">
                <div class="upload-icon"><i class="bi bi-cloud-upload"></i></div>
                <div class="upload-text">Click or drag to upload photo/video</div>
                <input type="file" id="media" name="media" accept="image/*,video/*">
            </div>

            <!-- File Preview -->
            <div id="filePreview" class="file-preview">
                <div style="text-align: center;">
                    <img id="previewImage" style="display: none; max-width: 100%; max-height: 200px; border-radius: 8px;">
                    <video id="previewVideo" style="display: none; max-width: 100%; max-height: 200px; border-radius: 8px;" controls></video>
                    <div class="file-name" id="fileName"></div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearFilePreview()" style="margin-top: 8px; width: auto;">
                    <i class="bi bi-x-circle"></i> Remove
                </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="bi bi-send"></i>
                <span id="btnText">Submit Complaint</span>
                <span id="btnSpinner" class="spinner"></span>
            </button>

        </form>

        <div style="text-align: center; margin-top: 10px;">
            <a href="/dashboard" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>

    </div>

</div>

<!-- ===== CAMERA MODAL ===== -->
<div class="camera-modal" id="cameraModal">

    <div class="camera-box">

        <h3><i class="bi bi-camera"></i> Capture Evidence</h3>

        <video id="camera" autoplay></video>

        <div class="camera-actions">
            <button type="button" onclick="capturePhoto()"><i class="bi bi-camera"></i> Photo</button>
            <button type="button" onclick="recordVideo()"><i class="bi bi-camera-reels"></i> Video</button>
        </div>

        <button class="done" id="doneBtn" style="display:none" onclick="attachMedia()">
            <i class="bi bi-check-circle"></i> Done
        </button>

        <button class="retake" id="retakeBtn" style="display:none" onclick="retake()">
            <i class="bi bi-arrow-counterclockwise"></i> Recapture
        </button>

        <button class="close" onclick="closeCamera()">
            <i class="bi bi-x-circle"></i> Close
        </button>

        <div id="cameraPreview" class="preview"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

// ==========================
// THEME TOGGLE
// ==========================

const toggle = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    if (theme === "dark") {
        icon.className = "bi bi-sun-fill";
        toggle.classList.remove("btn-light");
        toggle.classList.add("btn-warning");
    } else {
        icon.className = "bi bi-moon-fill";
        toggle.classList.remove("btn-warning");
        toggle.classList.add("btn-light");
    }
}

toggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
});

window.addEventListener("DOMContentLoaded", () => {
    const savedTheme = localStorage.getItem("theme") || "light";
    setTheme(savedTheme);
});

// ==========================
// FILE UPLOAD PREVIEW
// ==========================

document.getElementById('media').addEventListener('change', function(e) {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        const previewDiv = document.getElementById('filePreview');
        const previewImage = document.getElementById('previewImage');
        const previewVideo = document.getElementById('previewVideo');
        const fileName = document.getElementById('fileName');
        
        previewDiv.classList.add('show');
        fileName.textContent = file.name;
        
        reader.onload = function(e) {
            if (file.type.startsWith('image/')) {
                previewImage.style.display = 'block';
                previewVideo.style.display = 'none';
                previewImage.src = e.target.result;
            } else if (file.type.startsWith('video/')) {
                previewImage.style.display = 'none';
                previewVideo.style.display = 'block';
                previewVideo.src = e.target.result;
            }
        };
        reader.readAsDataURL(file);
    }
});

function clearFilePreview() {
    document.getElementById('media').value = '';
    document.getElementById('filePreview').classList.remove('show');
    document.getElementById('previewImage').style.display = 'none';
    document.getElementById('previewVideo').style.display = 'none';
    document.getElementById('fileName').textContent = '';
}

// ==========================
// FORM SUBMISSION
// ==========================

document.getElementById('complaintForm').addEventListener('submit', function(e) {
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    
    btnText.textContent = 'Submitting...';
    btnSpinner.style.display = 'inline-block';
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.7';
});

// ==========================
// CAMERA FUNCTIONALITY
// ==========================

let camera = document.getElementById("camera");
let modal = document.getElementById("cameraModal");
let stream;
let capturedFile = null;

function openCamera() {
    modal.style.display = "flex";

    navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
    })
    .then(s => {
        stream = s;
        camera.srcObject = s;
    })
    .catch(() => {
        alert("Camera permission denied. Please allow camera access.");
    });
}

function capturePhoto() {
    let canvas = document.createElement("canvas");
    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    let ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0);

    canvas.toBlob(blob => {
        capturedFile = new File(
            [blob],
            "camera_photo.png",
            { type: "image/png" }
        );

        showPreview(URL.createObjectURL(blob), "image");
        showButtons();
    });
}

function recordVideo() {
    let chunks = [];
    let recorder = new MediaRecorder(stream);

    recorder.ondataavailable = e => {
        chunks.push(e.data);
    };

    recorder.onstop = () => {
        let blob = new Blob(chunks, { type: "video/webm" });

        capturedFile = new File(
            [blob],
            "camera_video.webm",
            { type: "video/webm" }
        );

        showPreview(URL.createObjectURL(blob), "video");
        showButtons();
    };

    recorder.start();
    alert("Recording 10 seconds...");
    setTimeout(() => {
        recorder.stop();
    }, 10000);
}

function showPreview(url, type) {
    let div = document.getElementById("cameraPreview");
    div.innerHTML = "";

    if (type == "image") {
        let img = document.createElement("img");
        img.src = url;
        div.appendChild(img);
    } else {
        let video = document.createElement("video");
        video.src = url;
        video.controls = true;
        div.appendChild(video);
    }
}

function showButtons() {
    document.getElementById("doneBtn").style.display = "block";
    document.getElementById("retakeBtn").style.display = "block";
}

function attachMedia() {
    if (capturedFile == null) {
        alert("Please capture media first");
        return;
    }

    let input = document.getElementById("media");
    let dt = new DataTransfer();
    dt.items.add(capturedFile);
    input.files = dt.files;

    // Trigger change event to show preview
    input.dispatchEvent(new Event('change'));

    closeCamera();
    alert("✅ Evidence attached successfully!");
}

function retake() {
    capturedFile = null;
    document.getElementById("cameraPreview").innerHTML = "";
    document.getElementById("doneBtn").style.display = "none";
    document.getElementById("retakeBtn").style.display = "none";
}

function closeCamera() {
    modal.style.display = "none";
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
    }
    document.getElementById("cameraPreview").innerHTML = "";
    document.getElementById("doneBtn").style.display = "none";
    document.getElementById("retakeBtn").style.display = "none";
}

// ==========================
// AUTO-DISMISS ALERTS
// ==========================

document.addEventListener('DOMContentLoaded', function() {
    const alerts = document.querySelectorAll('.alert');
    alerts.forEach(alert => {
        setTimeout(() => {
            alert.style.transition = 'opacity 0.5s ease';
            alert.style.opacity = '0';
            setTimeout(() => {
                alert.remove();
            }, 500);
        }, 5000);
    });
});

</script>

</body>

</html>
