<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | CivicPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg: #f4f7fc;
            --text: #212529;
            --card-bg: #ffffff;
            --shadow: 0 4px 10px rgba(0,0,0,0.15);
            --navbar-bg: #1565c0;
            --border-color: #dee2e6;
            --heading-color: #1565c0;
        }
        
        [data-theme="dark"] {
            --bg: #121212;
            --text: #ffffff;
            --card-bg: #1f1f1f;
            --shadow: 0 5px 15px rgba(0,0,0,0.6);
            --navbar-bg: #0d1117;
            --border-color: #404040;
            --heading-color: #4fc3f7;
        }
        
        * {
            transition: all 0.3s ease;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
        }
        
        /* ===== NAVBAR ===== */
        .navbar {
            background: var(--navbar-bg) !important;
            padding: 15px 0;
            box-shadow: var(--shadow);
        }
        
        .navbar-brand {
            color: white !important;
            font-size: 24px;
            font-weight: bold;
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 18px;
        }
        
        .logout-btn {
            padding: 8px 16px;
            font-size: 14px;
        }
        
        /* ===== NOTIFICATIONS ===== */
        .container-main {
            padding: 30px 0 50px 0;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .page-header h2 {
            color: var(--text);
            margin: 0;
        }
        
        .page-header h2 i {
            color: var(--heading-color);
        }
        
        .notification-item {
            background: var(--card-bg);
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border-left: 4px solid #1565c0;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }
        
        .notification-item:hover {
            transform: translateX(5px);
        }
        
        .notification-item.unread {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.08);
        }
        
        [data-theme="dark"] .notification-item.unread {
            background: rgba(255, 152, 0, 0.15);
        }
        
        .notification-item .time {
            color: #888;
            font-size: 12px;
            white-space: nowrap;
        }
        
        [data-theme="dark"] .notification-item .time {
            color: #999;
        }
        
        .notification-item .badge-type {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .badge-email { background: #1565c0; color: white; }
        .badge-sms { background: #4caf50; color: white; }
        .badge-push { background: #ff9800; color: white; }
        
        [data-theme="dark"] .badge-email { background: #0d47a1; }
        [data-theme="dark"] .badge-sms { background: #1b5e20; }
        [data-theme="dark"] .badge-push { background: #e65100; }
        
        .notification-item .notification-title {
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text);
        }
        
        .notification-item .notification-message {
            color: var(--text);
            opacity: 0.8;
            margin-bottom: 0;
            font-size: 14px;
        }
        
        /* ===== PREFERENCES CARD ===== */
        .pref-card {
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }
        
        .pref-card h5 {
            color: var(--text);
            margin-bottom: 15px;
        }
        
        .pref-card .form-check {
            margin-bottom: 8px;
        }
        
        .pref-card .form-check-label {
            color: var(--text);
            font-weight: 500;
        }
        
        .form-check-input:checked {
            background-color: #1565c0;
            border-color: #1565c0;
        }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        
        .empty-state i {
            font-size: 56px;
            color: #888;
            display: block;
            margin-bottom: 15px;
        }
        
        .empty-state p {
            color: var(--text);
            opacity: 0.7;
            font-size: 16px;
        }
        
        /* ===== ALERTS ===== */
        .alert {
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        
        [data-theme="dark"] .alert-success {
            background-color: #1a3a2a;
            color: #8fdfb2;
            border-color: #2a5a3a;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        
        [data-theme="dark"] .alert-danger {
            background-color: #3a1a1a;
            color: #ff8f8f;
            border-color: #5a2a2a;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container-main {
                padding: 15px;
            }
            
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .page-header .btn-group {
                display: flex;
                gap: 5px;
            }
            
            .page-header .btn-group .btn {
                flex: 1;
                font-size: 13px;
                padding: 6px 10px;
            }
            
            .notification-item {
                padding: 12px 15px;
            }
            
            .notification-item .badge-type {
                font-size: 10px;
                padding: 2px 8px;
            }
            
            .pref-card {
                padding: 15px;
            }
            
            .pref-card .row {
                gap: 5px;
            }
            
            .navbar-brand {
                font-size: 18px;
            }
            
            .theme-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand">🏛️ CivicPulse</span>
        <div class="nav-right">
            <!-- Theme Toggle -->
            <button id="themeToggle" class="btn btn-light theme-btn">
                <i id="themeIcon" class="bi bi-moon-fill"></i>
            </button>
            <a href="/logout" class="btn btn-danger logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<div class="container container-main">
    
    <!-- Page Header -->
    <div class="page-header">
        <h2><i class="bi bi-bell-fill text-primary"></i> Notifications</h2>
        <div class="btn-group">
            <button class="btn btn-outline-primary btn-sm" onclick="markAllRead()">
                <i class="bi bi-check-all"></i> Mark All Read
            </button>
            <button class="btn btn-primary btn-sm" onclick="sendTestNotification()">
                <i class="bi bi-send"></i> Test
            </button>
        </div>
    </div>
    
    <!-- Notification Preferences -->
    <div class="pref-card">
        <h5><i class="bi bi-gear"></i> Notification Preferences</h5>
        <div class="row g-3">
            <div class="col-md-3 col-6">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="emailEnabled" 
                           th:checked="${preferences != null and preferences.emailEnabled}">
                    <label class="form-check-label" for="emailEnabled">
                        <i class="bi bi-envelope"></i> Email
                    </label>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="smsEnabled" 
                           th:checked="${preferences != null and preferences.smsEnabled}">
                    <label class="form-check-label" for="smsEnabled">
                        <i class="bi bi-phone"></i> SMS
                    </label>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="pushEnabled" 
                           th:checked="${preferences != null and preferences.pushEnabled}">
                    <label class="form-check-label" for="pushEnabled">
                        <i class="bi bi-bell"></i> Push
                    </label>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <button class="btn btn-success btn-sm w-100" onclick="savePreferences()">
                    <i class="bi bi-save"></i> Save
                </button>
            </div>
        </div>
    </div>
    
    <!-- Notification List -->
    <div id="notificationList">
        <div th:if="${notifications == null or #lists.isEmpty(notifications)}" class="empty-state">
            <i class="bi bi-bell-slash"></i>
            <p>No notifications yet</p>
            <p style="font-size: 14px; opacity: 0.5;">We'll notify you when something important happens.</p>
        </div>
        
        <div th:each="notification : ${notifications}" 
             class="notification-item" 
             th:classappend="${!notification.read} ? 'unread' : ''"
             th:onclick="'markRead(' + ${notification.id} + ')'">
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                    <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                        <span class="badge-type"
                              th:classappend="${notification.type == 'EMAIL'} ? 'badge-email' :
                                              (${notification.type == 'SMS'} ? 'badge-sms' :
                                              (${notification.type == 'PUSH'} ? 'badge-push' : ''))"
                              th:text="${notification.type}">
                            EMAIL
                        </span>
                        <span th:if="${!notification.read}" class="badge bg-warning text-dark">New</span>
                    </div>
                    <div class="notification-title" th:text="${notification.title}">Complaint Updated</div>
                    <p class="notification-message" th:text="${notification.message}">Your complaint has been updated.</p>
                </div>
                <small class="time ms-2" 
                       th:text="${notification.createdAt != null ? #temporals.format(notification.createdAt, 'dd MMM yyyy HH:mm') : ''}">
                    01 Jan 2024 10:00
                </small>
            </div>
        </div>
    </div>
    
    <!-- Hidden userId for JavaScript -->
    <input type="hidden" id="userId" th:value="${userId}">
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

// ==========================
// THEME TOGGLE
// ==========================

const toggle = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    if (theme === "dark") {
        icon.className = "bi bi-sun-fill";
        toggle.classList.remove("btn-light");
        toggle.classList.add("btn-warning");
    } else {
        icon.className = "bi bi-moon-fill";
        toggle.classList.remove("btn-warning");
        toggle.classList.add("btn-light");
    }
}

toggle.addEventListener("click", function() {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
});

// Load saved theme
document.addEventListener("DOMContentLoaded", function() {
    const savedTheme = localStorage.getItem("theme") || "light";
    setTheme(savedTheme);
    updateNotificationCount();
});

// ==========================
// NOTIFICATION FUNCTIONS
// ==========================

const userId = document.getElementById('userId')?.value || '';

function markRead(notificationId) {
    if (!notificationId) return;
    
    fetch('/notifications/api/mark-read/' + notificationId, {
        method: 'PUT'
    })
    .then(function(response) {
        return response.json();
    })
    .then(function() {
        location.reload();
    })
    .catch(function(error) {
        console.error('Error:', error);
        showAlert('Failed to mark notification as read', 'danger');
    });
}

function markAllRead() {
    fetch('/notifications/api/mark-all-read', {
        method: 'PUT'
    })
    .then(function(response) {
        return response.json();
    })
    .then(function() {
        location.reload();
    })
    .catch(function(error) {
        console.error('Error:', error);
        showAlert('Failed to mark all as read', 'danger');
    });
}

function savePreferences() {
    var preferences = {
        emailEnabled: document.getElementById('emailEnabled').checked,
        smsEnabled: document.getElementById('smsEnabled').checked,
        pushEnabled: document.getElementById('pushEnabled').checked,
        complaintUpdates: true,
        assignmentNotifications: true,
        resolutionNotifications: true
    };

    fetch('/notifications/api/preferences', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(preferences)
    })
    .then(function(response) {
        return response.json();
    })
    .then(function() {
        showAlert('✅ Preferences saved successfully!', 'success');
    })
    .catch(function(error) {
        console.error('Error:', error);
        showAlert('❌ Failed to save preferences', 'danger');
    });
}

function sendTestNotification() {
    fetch('/notifications/api/test', {
        method: 'POST'
    })
    .then(function(response) {
        return response.json();
    })
    .then(function() {
        showAlert('✅ Test notifications sent! Check your email.', 'success');
    })
    .catch(function(error) {
        console.error('Error:', error);
        showAlert('❌ Failed to send test notifications', 'danger');
    });
}

function updateNotificationCount() {
    var badge = document.getElementById('notificationCount');
    if (!badge) return;
    
    if (userId && userId !== '' && userId !== 'null' && userId !== 'undefined') {
        fetch('/notifications/api/user/' + userId + '/count')
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                var count = data.count || 0;
                badge.textContent = count;
            })
            .catch(function(error) {
                console.error('Error fetching count:', error);
                badge.textContent = '0';
            });
    }
}

// ==========================
// SHOW ALERT MESSAGE
// ==========================

function showAlert(message, type) {
    var alertDiv = document.createElement('div');
    alertDiv.className = 'alert alert-' + type + ' alert-dismissible fade show';
    alertDiv.role = 'alert';
    alertDiv.innerHTML = message + 
        '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
    
    var container = document.querySelector('.container-main');
    var header = document.querySelector('.page-header');
    container.insertBefore(alertDiv, header.nextSibling);
    
    setTimeout(function() {
        alertDiv.remove();
    }, 5000);
}

// ==========================
// AUTO-REFRESH NOTIFICATION COUNT
// ==========================

setInterval(function() {
    updateNotificationCount();
}, 30000);

</script>

</body>
</html>
