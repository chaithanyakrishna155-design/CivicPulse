<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicPulse - Login</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

:root {
    --bg: #eaf3ff;
    --container-bg: #ffffff;
    --text: #212529;
    --heading-color: #1565c0;
    --shadow: 0 0 15px rgba(0,0,0,0.2);
    --input-bg: #ffffff;
    --input-border: #ccc;
    --input-text: #212529;
    --button-bg: #1565c0;
    --button-hover: #0d47a1;
    --button-text: white;
    --error-color: #dc3545;
    --error-bg: #f8d7da;
    --error-border: #f5c6cb;
    --link-color: #1565c0;
    --success-color: #28a745;
    --warning-color: #ffc107;
}

[data-theme="dark"] {
    --bg: #121212;
    --container-bg: #1f1f1f;
    --text: #ffffff;
    --heading-color: #4fc3f7;
    --shadow: 0 0 20px rgba(0,0,0,0.6);
    --input-bg: #2a2a2a;
    --input-border: #404040;
    --input-text: #ffffff;
    --button-bg: #0d47a1;
    --button-hover: #1565c0;
    --button-text: white;
    --error-color: #ff6b6b;
    --error-bg: #3a1a1a;
    --error-border: #5a2a2a;
    --link-color: #4fc3f7;
    --success-color: #66bb6a;
    --warning-color: #f57c00;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
    transition: all 0.3s ease;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    padding: 20px;
    position: relative;
}

/* Theme toggle button - positioned at top right */
.theme-toggle-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

.theme-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    border: none;
    cursor: pointer;
    background: var(--container-bg);
    color: var(--text);
    box-shadow: var(--shadow);
}

.theme-btn:hover {
    transform: rotate(30deg) scale(1.1);
}

.container {
    width: 400px;
    max-width: 100%;
    background: var(--container-bg);
    padding: 35px 30px 30px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    color: var(--text);
    margin-top: 30px;
}

/* Logo/Header */
.login-header {
    text-align: center;
    margin-bottom: 25px;
}

.login-header .logo-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 5px;
}

.login-header h2 {
    font-size: 26px;
    font-weight: 700;
    color: var(--heading-color);
    margin: 0;
}

.login-header .subtitle {
    color: var(--text);
    opacity: 0.6;
    font-size: 14px;
    margin-top: 5px;
}

/* Form Elements */
.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 5px;
}

.form-group label i {
    margin-right: 6px;
    color: var(--heading-color);
}

.input-group {
    position: relative;
}

.input-group input {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--input-text);
    font-size: 15px;
    transition: all 0.3s ease;
}

.input-group input:focus {
    outline: none;
    border-color: var(--heading-color);
    box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15);
}

.input-group input::placeholder {
    color: var(--input-text);
    opacity: 0.5;
}

.input-group .input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text);
    opacity: 0.4;
    pointer-events: none;
}

/* Error Message */
.error-message {
    background: var(--error-bg);
    color: var(--error-color);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid var(--error-border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    display: none;
}

.error-message.show {
    display: flex;
}

.error-message i {
    font-size: 20px;
}

/* Success Message */
.success-message {
    background: var(--success-bg);
    color: var(--success-color);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid var(--success-border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    display: none;
}

.success-message.show {
    display: flex;
}

/* Buttons */
.btn-login {
    width: 100%;
    padding: 14px;
    background: var(--button-bg);
    color: var(--button-text);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    position: relative;
    margin-top: 5px;
}

.btn-login:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(21, 101, 192, 0.3);
}

.btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none !important;
}

.btn-login i {
    margin-right: 8px;
}

.btn-login .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.8s ease-in-out infinite;
    margin: 0 auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Links */
.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: var(--link-color);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
}

.links a:hover {
    text-decoration: underline;
}

.links .separator {
    color: var(--text);
    opacity: 0.3;
    margin: 0 8px;
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 20px 0;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--input-border);
}

.divider span {
    padding: 0 15px;
    color: var(--text);
    opacity: 0.5;
    font-size: 12px;
}

/* Dark mode specific styles */
[data-theme="dark"] .theme-btn {
    background: #1f1f1f;
    color: white;
    border: 1px solid #404040;
}

[data-theme="dark"] input::placeholder {
    color: #888;
}

[data-theme="dark"] .input-group input:focus {
    box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
}

/* Responsive */
@media (max-width: 480px) {
    body {
        padding: 10px;
    }
    
    .container {
        padding: 25px 20px 20px;
        margin: 60px 10px 15px 10px;
        border-radius: 10px;
    }
    
    .theme-toggle-container {
        top: 15px;
        right: 15px;
    }
    
    .theme-btn {
        width: 40px;
        height: 40px;
        font-size: 18px;
    }
    
    .login-header h2 {
        font-size: 22px;
    }
    
    .btn-login {
        padding: 12px;
        font-size: 15px;
    }
}

</style>

</head>

<body>

<!-- Theme Toggle Button - Fixed at top right -->
<div class="theme-toggle-container">
    <button id="themeToggle" class="theme-btn">
        <i id="themeIcon" class="bi bi-moon-fill"></i>
    </button>
</div>

<div class="container">

    <!-- Login Header -->
    <div class="login-header">
        <span class="logo-icon">🏛️</span>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your CivicPulse account</p>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage" th:if="${error}">
        <i class="bi bi-exclamation-circle"></i>
        <span th:text="${error}">Invalid email or password</span>
    </div>

    <!-- Success Message (for logout) -->
    <div class="success-message" id="successMessage" th:if="${param.logout}">
        <i class="bi bi-check-circle"></i>
        <span>You have been logged out successfully</span>
    </div>

    <form action="/login" method="post" id="loginForm">

        <div class="form-group">
            <label for="email"><i class="bi bi-envelope"></i> Email Address</label>
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <span class="input-icon"><i class="bi bi-envelope"></i></span>
            </div>
        </div>

        <div class="form-group">
            <label for="password"><i class="bi bi-lock"></i> Password</label>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <span class="input-icon" id="togglePassword" style="cursor: pointer; opacity: 0.6; z-index: 1;" onclick="togglePasswordVisibility()">
                    <i class="bi bi-eye"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
            <i class="bi bi-box-arrow-in-right"></i>
            <span id="btnText">Login</span>
            <span id="btnSpinner" class="spinner"></span>
        </button>

    </form>

    <!-- Divider -->
    <div class="divider">
        <span>New here?</span>
    </div>

    <div class="links">
        <a href="/register"><i class="bi bi-person-plus"></i> Create new account</a>
    </div>

</div>

<script>

// ==========================
// THEME TOGGLE
// ==========================

const toggle = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    if (theme === "dark") {
        icon.className = "bi bi-sun-fill";
    } else {
        icon.className = "bi bi-moon-fill";
    }
}

toggle.addEventListener("click", function() {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
});

// Load saved theme on page load
document.addEventListener("DOMContentLoaded", function() {
    const savedTheme = localStorage.getItem("theme") || "light";
    setTheme(savedTheme);
    showMessages();
});

// ==========================
// SHOW MESSAGES
// ==========================

function showMessages() {
    // Show error message if exists
    const errorMsg = document.getElementById('errorMessage');
    if (errorMsg && errorMsg.querySelector('span').textContent.trim() !== '') {
        errorMsg.classList.add('show');
        // Auto-hide after 5 seconds
        setTimeout(function() {
            errorMsg.classList.remove('show');
        }, 5000);
    }
    
    // Show success message if logout param exists
    const successMsg = document.getElementById('successMessage');
    if (successMsg && window.location.search.includes('logout=true')) {
        successMsg.classList.add('show');
        setTimeout(function() {
            successMsg.classList.remove('show');
        }, 5000);
    }
}

// ==========================
// PASSWORD VISIBILITY TOGGLE
// ==========================

function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.querySelector('#togglePassword i');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.className = 'bi bi-eye-slash';
    } else {
        passwordInput.type = 'password';
        toggleIcon.className = 'bi bi-eye';
    }
}

// ==========================
// FORM SUBMISSION WITH LOADING
// ==========================

document.getElementById('loginForm').addEventListener('submit', function(e) {
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    
    // Validate
    if (!email.value.trim() || !password.value.trim()) {
        e.preventDefault();
        showValidationError('Please fill in all fields');
        return;
    }
    
    // Show loading state
    btnText.textContent = 'Logging in...';
    btnSpinner.style.display = 'inline-block';
    btn.disabled = true;
    btn.querySelector('i').style.display = 'none';
});

// ==========================
// SHOW VALIDATION ERROR
// ==========================

function showValidationError(message) {
    const errorMsg = document.getElementById('errorMessage');
    const span = errorMsg.querySelector('span');
    span.textContent = message;
    errorMsg.classList.add('show');
    
    setTimeout(function() {
        errorMsg.classList.remove('show');
    }, 5000);
}

// ==========================
// KEYBOARD SHORTCUTS
// ==========================

document.addEventListener('keydown', function(e) {
    // Ctrl+Enter or Cmd+Enter to submit
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        document.getElementById('loginForm').submit();
    }
});

// ==========================
// AUTO-FOCUS ON PAGE LOAD
// ==========================

document.addEventListener('DOMContentLoaded', function() {
    const emailInput = document.getElementById('email');
    if (emailInput && !emailInput.value) {
        setTimeout(function() {
            emailInput.focus();
        }, 300);
    }
});

</script>

</body>

</html>
